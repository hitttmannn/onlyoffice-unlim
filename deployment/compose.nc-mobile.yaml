name: onlyoffice-unlim-nc-mobile
services:
  docs:
    image: onlyoffice/documentserver@sha256:bff1a9fd46f2b79ada776fd0447c3fccf66cbf44c1996ec9316efa8ac4ee3fd5
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${JWT_SECRET:?Run nc-mobile-install.py prepare}
      JWT_HEADER: ${JWT_HEADER:-Authorization}
    ports:
      - '127.0.0.1:18082:80'
    mem_limit: 4g
    memswap_limit: 4608m
    cpus: 1.0
    pids_limit: 1024
    restart: unless-stopped
    volumes:
      - ../private/nc-mobile/plugin:/var/www/onlyoffice/documentserver/sdkjs-plugins/mobile-panel:ro
      - docs_data:/var/www/onlyoffice/Data
      - docs_lib:/var/lib/onlyoffice
      - docs_db:/var/lib/postgresql
      - docs_logs:/var/log/onlyoffice
volumes:
  docs_data:
  docs_lib:
  docs_db:
  docs_logs:
